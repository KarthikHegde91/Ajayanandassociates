<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OG card</title>
<style>
  @font-face { font-family: "Inter"; src: url("../assets/fonts/inter.woff2") format("woff2"); font-weight: 400 600; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #F3F5FE; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; background: #F3F5FE; }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #5D5294, #B5ABFC); }
  img { width: 760px; height: auto; display: block; }
  .tag { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-weight: 600; font-size: 26px; letter-spacing: 0.28em; text-transform: uppercase; color: #232552; }
  .loc { font-family: "Inter", "Segoe UI", Arial, sans-serif; font-weight: 500; font-size: 22px; color: #5D5294; letter-spacing: 0.04em; }
</style></head>
<body><div class="card"><img src="../assets/img/logo-light.png" alt=""><div class="tag">Audit &nbsp;|&nbsp; Accounting &nbsp;|&nbsp; Taxation</div><div class="loc">Bengaluru, Karnataka</div></div></body></html>
